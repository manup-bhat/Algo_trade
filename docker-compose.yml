services:
  redis:
    image: redis:7-alpine
    container_name: ivbs_redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    command: >
      redis-server
      --save 60 1
      --save 300 1
      --appendonly yes
      --appendfsync everysec
      --loglevel warning
      --maxmemory 512mb
      --maxmemory-policy noeviction
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3

volumes:
  redis_data:
    driver: local
